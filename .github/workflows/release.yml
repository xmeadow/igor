name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config gcc-mingw-w64-i686

      - name: Build both targets
        run: |
          make
          make win32

      - name: Collect the binaries
        run: |
          mkdir dist
          # The names carry no version on purpose: that is what makes
          # /releases/latest/download/<name> a link the download page can
          # keep without being edited for every release. The version is the
          # release itself, and `igor --version` says it too.
          cp igor     dist/igor-linux-x86_64
          cp igor.exe dist/igor-win32-i686.exe
          # From inside dist, so the names in the file are the names the
          # assets have once downloaded - `sha256sum -c` works where they land.
          cd dist && sha256sum igor-* > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "igor $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
